<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5E1A27">
<meta name="apple-mobile-web-app-title" content="Bru &amp; Ams">
<meta name="description" content="Itinerario del viaje del 18 al 22 de agosto de 2026: Bruselas, Brujas, Gante, Ámsterdam, Dinant y Luxemburgo.">
<title>Bruselas &amp; Ámsterdam</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="manifest.json">
<script>
// Set the theme before first paint (avoids a flash of the wrong theme).
// Kept in sync later by the toggle button in the header.
(function(){
  try{
    var s = JSON.parse(localStorage.getItem("bru26_settings_v1") || "{}");
    var theme = (s.theme === "light" || s.theme === "dark") ? s.theme
      : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  }catch(e){}
})();
</script>
<style>
  :root{
    --cream:#F7F2EA;
    --card:#FFFFFF;
    --burgundy:#8B2635;
    --burgundy-deep:#5E1A27;
    --gold:#B08D57;
    --gold-soft:#E7D9BE;
    --ink:#241C16;
    --grey:#8A8175;
    --metro:#1B5E8C;
    --metro-soft:#E4EEF4;
    --reserved:#4B7A51;
    --reserved-soft:#E8F0E6;
    --line:#EAE2D3;
    --burgundy-text:var(--burgundy);
    --burgundy-text-deep:var(--burgundy-deep);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--burgundy-deep); overscroll-behavior-y:none;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color:var(--ink);
    background:var(--cream);
  }
  #app{ display:flex; flex-direction:column; height:100vh; height:100dvh; max-width:600px; margin:0 auto; background:var(--cream); position:relative; overflow:hidden;}

  /* ---------- HEADER ---------- */
  header{
    padding: calc(8px + var(--safe-t)) 18px 10px;
    background: linear-gradient(155deg, var(--burgundy) 0%, var(--burgundy-deep) 100%);
    color:#fff; flex-shrink:0; position:relative; z-index:5;
    box-shadow:0 6px 18px rgba(0,0,0,.18);
    display:flex; align-items:center; gap:11px;
  }
  header .logo{ width:38px; height:38px; flex-shrink:0; filter:drop-shadow(0 2px 5px rgba(0,0,0,.3));}
  header .headtext{ min-width:0; }
  header .eyebrow{ font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-soft); font-weight:700;}
  header h1{ font-family:Georgia, "Times New Roman", serif; font-size:18px; margin:1px 0 0; font-weight:700; line-height:1.15;}
  header .sub{ font-size:11.5px; color:#EADFCB; margin-top:2px; font-style:italic;}
  .theme-toggle{
    margin-left:auto; flex-shrink:0; width:34px; height:34px; border-radius:50%; border:none;
    background:rgba(255,255,255,.14); color:#fff; font-size:16px; display:flex; align-items:center;
    justify-content:center; font-family:inherit; line-height:1;
  }
  .theme-toggle:active{ background:rgba(255,255,255,.26); }

  /* ---------- DAY PILLS ---------- */
  nav.pills{
    display:flex; gap:6px; padding:10px 14px 12px; overflow-x:auto;
    background:var(--burgundy-deep); flex-shrink:0; -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  nav.pills::-webkit-scrollbar{display:none;}
  nav.pills button{
    flex:0 0 auto; border:none; border-radius:20px; padding:8px 14px; font-size:12.5px; font-weight:700;
    background:rgba(255,255,255,.10); color:#EADFCB; white-space:nowrap; font-family:inherit;
    transition:background .15s, color .15s;
  }
  nav.pills button.active{ background:var(--gold); color:var(--burgundy-deep); }

  /* ---------- MAIN SCROLL ---------- */
  main{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom: calc(80px + var(--safe-b)); }
  .day-banner{ padding:18px 18px 14px; border-bottom:1px solid var(--line);}
  .day-banner .tag{ display:inline-block; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--burgundy-text); font-weight:800; background:var(--gold-soft); padding:3px 9px; border-radius:20px; margin-bottom:8px;}
  .day-banner h2{ font-family:Georgia, serif; font-size:21px; margin:0 0 4px; color:var(--burgundy-text-deep);}
  .day-banner p{ margin:0; font-size:13.5px; color:var(--grey); font-style:italic;}
  .day-progress{ margin-top:10px; display:flex; align-items:center; gap:8px; font-size:11.5px; font-weight:700; color:var(--grey);}
  .day-progress .dp-label{ white-space:nowrap;}
  .day-progress .bar{ flex:1; height:5px; border-radius:3px; background:var(--line); overflow:hidden;}
  .day-progress .bar > span{ display:block; height:100%; background:var(--gold); border-radius:3px; transition:width .25s ease;}

  /* ---------- "IR A HOY" FLOATING BUTTON ---------- */
  .fab-today{
    position:absolute; right:14px; bottom:calc(76px + var(--safe-b)); z-index:8;
    display:none; align-items:center; gap:6px; border:none; border-radius:22px; padding:10px 16px;
    background:var(--burgundy); color:#fff; font-family:inherit; font-size:12.5px; font-weight:800;
    box-shadow:0 6px 16px rgba(0,0,0,.28);
  }
  .fab-today:active{ background:var(--burgundy-deep); }

  .notebox{ margin:14px 18px; padding:12px 14px; background:var(--gold-soft); border-left:4px solid var(--gold); border-radius:8px; font-size:13px; line-height:1.5; color:#4a3b25;}
  .notebox p{margin:0 0 6px;}
  .notebox p:last-child{margin-bottom:0;}

  .section-label{ position:sticky; top:0; z-index:3; background:linear-gradient(var(--cream) 80%, transparent); padding:14px 18px 8px; font-family:Georgia, serif; font-size:16px; font-weight:700; color:var(--burgundy-text-deep);}

  .stop{ margin:0 18px 12px; border-radius:14px; position:relative; overflow:hidden; box-shadow:0 1px 3px rgba(90,60,30,.08);}
  .stop-content{ background:var(--card); border-radius:14px; padding:13px 15px; border:1px solid var(--line); position:relative; z-index:2; transition:opacity .2s; touch-action:pan-y;}
  .stop.dragging .stop-content{ transition:none; }
  .stop.done .stop-content{ opacity:.55; }
  .stop.done .title{ text-decoration:line-through; }
  .stop.metro .stop-content{ border-left:4px solid var(--metro); }
  .stop.reserved .stop-content{ border-left:4px solid var(--reserved); }
  .stop.plain .stop-content{ border-left:4px solid var(--gold); }
  .stop .row1{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .stop .time{ font-weight:800; color:var(--burgundy-text); font-size:13.5px; white-space:nowrap; margin-right:2px;}
  .stop .emoji{ margin-right:2px;}
  .stop .title{ font-weight:700; font-size:15px; color:var(--ink); line-height:1.3;}
  .stop .chip{ font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:2px 8px; border-radius:10px; margin-left:auto; white-space:nowrap;}
  .stop.metro .chip{ background:var(--metro-soft); color:var(--metro);}
  .stop.reserved .chip{ background:var(--reserved-soft); color:var(--reserved);}
  .stop .desc{ margin-top:6px; font-size:13.5px; line-height:1.5; color:#4a4038;}
  .stop .desc p{ margin:0 0 5px;}
  .stop .desc p:last-child{ margin-bottom:0;}

  /* ---------- SWIPE ACTIONS ---------- */
  .swipe-action{
    position:absolute; top:0; bottom:0; width:96px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:1; opacity:0; font-size:11px; font-weight:800;
    color:#fff; gap:3px; text-align:center; padding:0 6px;
  }
  .swipe-action .ic{ font-size:19px; line-height:1;}
  .action-info{ left:0; background:linear-gradient(135deg, var(--metro), #123f5c);}
  .action-done{ right:0; background:linear-gradient(135deg, var(--reserved), #33552f);}
  .stop.done .action-done{ background:linear-gradient(135deg, #9a7a3d, var(--gold));}

  .maplink{
    display:inline-flex; align-items:center; gap:6px; margin-top:10px; font-size:12.5px; font-weight:800;
    color:#fff; background:var(--burgundy); padding:7px 13px; border-radius:20px; text-decoration:none;
    letter-spacing:.02em;
  }
  .maplink.route{ background:var(--gold); color:var(--burgundy-deep);}
  .maplink svg{ width:13px; height:13px; flex-shrink:0;}

  .swipe-hint{ margin:0 18px 14px; font-size:11.5px; color:var(--grey); display:flex; align-items:center; gap:6px; }
  .swipe-hint .arrows{ font-size:13px; }

  .routebar{ margin:4px 18px 20px; padding:10px 14px; background:var(--gold-soft); border-radius:10px; font-size:12.5px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .routebar b{ color:var(--burgundy-deep); }

  /* ---------- INFO TAB ---------- */
  .info-block{ margin:16px 18px; }
  .info-block h3{ font-family:Georgia, serif; font-size:16px; color:var(--burgundy-deep); margin:0 0 8px; border-bottom:1px solid var(--gold-soft); padding-bottom:6px;}
  .info-row{ font-size:13.5px; line-height:1.6; margin-bottom:8px; color:#3a2f26;}
  .info-row b{ color:var(--burgundy-text);}
  .tip-link{ display:inline-block; margin-left:4px; font-weight:800; color:var(--burgundy-text); text-decoration:underline; white-space:nowrap;}

  /* ---------- TAB BAR ---------- */
  .tabbar{
    position:absolute; left:0; right:0; bottom:0; z-index:10;
    display:flex; background:rgba(255,255,255,.92); backdrop-filter:blur(14px);
    border-top:1px solid var(--line); padding:8px 4px calc(6px + var(--safe-b));
  }
  .tabbar button{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none; font-family:inherit;
    color:var(--grey); padding:4px 0;
  }
  .tabbar button .dot{
    width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; background:var(--line); color:var(--grey); margin-bottom:1px;
  }
  .tabbar button.active{ color:var(--burgundy-text);}
  .tabbar button.active .dot{ background:var(--burgundy); color:#fff;}
  .tabbar button.today .dot{ box-shadow:0 0 0 2px var(--gold);}
  .tabbar button .lbl{ font-size:10px; font-weight:700;}

  /* ---------- MODAL (place info sheet) ---------- */
  .modal-backdrop{
    position:absolute; top:0; right:0; bottom:0; left:0; background:rgba(20,10,5,.55); opacity:0; pointer-events:none;
    transition:opacity .25s ease; z-index:50;
  }
  .modal-backdrop.open{ opacity:1; pointer-events:auto; }
  .modal-sheet{
    position:absolute; left:0; right:0; bottom:0; background:var(--cream);
    border-radius:20px 20px 0 0; max-height:86%; transform:translateY(102%);
    transition:transform .32s cubic-bezier(.22,.85,.25,1); overflow:hidden;
    display:flex; flex-direction:column; box-shadow:0 -8px 30px rgba(0,0,0,.25);
  }
  .modal-backdrop.open .modal-sheet{ transform:translateY(0); }
  .modal-handle{ width:36px; height:4px; border-radius:3px; background:var(--line); margin:8px auto 2px; flex-shrink:0;}
  .modal-photo{ width:100%; height:190px; background:linear-gradient(135deg,var(--gold-soft),var(--line)); position:relative; flex-shrink:0; overflow:hidden;}
  .modal-photo img{ width:100%; height:100%; object-fit:cover; display:block;}
  .modal-photo .ph-fallback{ position:absolute; top:0; right:0; bottom:0; left:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:0 24px; text-align:center;}
  .modal-photo .ph-fallback .letter{ font-family:Georgia,serif; font-size:38px; color:var(--gold); font-weight:700;}
  .modal-photo .ph-fallback .retry-msg{ font-size:11.5px; color:var(--grey); line-height:1.4;}
  .modal-photo .ph-fallback .retry-link{ color:var(--metro); font-weight:700; text-decoration:underline; cursor:pointer;}
  .modal-photo .ph-spinner{ position:absolute; top:0; right:0; bottom:0; left:0; display:flex; align-items:center; justify-content:center;}
  .modal-photo .ph-spinner span{ width:22px; height:22px; border-radius:50%; border:3px solid rgba(139,38,53,.18); border-top-color:var(--burgundy-text); animation:spin 0.8s linear infinite;}
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .modal-close{
    position:absolute; top:10px; right:10px; width:30px; height:30px; border-radius:50%;
    background:rgba(20,10,5,.45); color:#fff; border:none; font-size:15px; z-index:2;
    display:flex; align-items:center; justify-content:center;
  }
  .modal-scroll{ overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 20px calc(24px + var(--safe-b));}
  .modal-scroll h3{ font-family:Georgia, serif; font-size:19px; color:var(--burgundy-text-deep); margin:0 0 8px; line-height:1.25;}
  .modal-wiki{ font-size:13.5px; line-height:1.55; color:#3a2f26; margin:0 0 12px; padding-bottom:12px; border-bottom:1px solid var(--line);}
  .modal-wiki .src{ display:block; margin-top:7px; font-size:10px; color:var(--grey); text-transform:uppercase; letter-spacing:.06em; font-weight:700;}
  .modal-desc p{ margin:0 0 6px; font-size:13.5px; line-height:1.5; color:#4a4038;}
  .modal-desc p:last-child{ margin-bottom:0; }
  .modal-loading-text{ font-size:12.5px; color:var(--grey); font-style:italic; }

  /* ---------- FREE TIME BLOCK ---------- */
  .freeblock{
    margin:0 18px 12px; background:repeating-linear-gradient(135deg, #FBF6EC 0 10px, #F6EFDF 10px 20px);
    border:1.5px dashed var(--gold); border-radius:14px; padding:14px 15px 12px; position:relative;
  }
  .fb-ribbon{ display:inline-block; font-size:10px; font-weight:800; letter-spacing:.08em; color:#fff; background:var(--gold); padding:3px 10px; border-radius:8px; margin-bottom:8px;}
  .fb-title{ font-weight:700; font-size:15px; color:var(--ink);}
  .fb-desc p{ margin:6px 0 0; font-size:13px; line-height:1.5; color:#4a4038;}
  .fb-subs{ margin-top:10px; border-top:1px dashed var(--gold); padding-top:8px;}
  .fb-sub-row{ display:flex; align-items:center; gap:6px; padding:6px 0; border-bottom:1px dotted #E2D3AE;}
  .fb-sub-row:last-child{ border-bottom:none;}
  .fb-sub-title{ font-size:13px; font-weight:600; color:var(--ink); flex:1;}
  .fb-info-btn{
    width:19px; height:19px; border-radius:50%; border:1.5px solid var(--gold); color:#9a7a3d;
    background:#fff; font-size:11px; font-weight:700; font-family:-apple-system, BlinkMacSystemFont, sans-serif;
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
    padding:0; line-height:1; text-align:center;
  }
  .fb-info-btn:active{ background:var(--gold); color:#fff; }
  .maplink.sub{ padding:5px 8px; margin-top:0;}
  .maplink.sub svg{ width:12px; height:12px; margin:0;}

  /* ---------- SETTINGS (Info tab) ---------- */
  .settings-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:13px; color:#3a2f26; padding:8px 0;}
  .settings-row input{ flex-shrink:0; width:20px; height:20px; accent-color:var(--burgundy);}
  .settings-btn{ margin-top:6px; width:100%; padding:10px; border-radius:10px; border:1.5px solid var(--burgundy); background:#fff; color:var(--burgundy); font-weight:700; font-size:13px; font-family:inherit; transition:background .15s, color .15s;}
  .settings-btn:active{ background:var(--burgundy); color:#fff;}
  .settings-btn.danger{ background:var(--burgundy); color:#fff; border-color:var(--burgundy-deep);}
  .settings-note{ margin:10px 0 0; font-size:11.5px; color:var(--grey); line-height:1.5; font-style:italic;}

  /* ---------- DARK MODE ----------
     Driven by [data-theme] on <html>, set by the toggle button in the header
     (falls back to the system setting — see the inline script in <head>).
     Placed last so these overrides win the cascade over the base rules above. */
  :root[data-theme="dark"]{
    --cream:#181210;
    --card:#251C17;
    --gold:#C7A06B;
    --gold-soft:#3B2C1C;
    --ink:#F1E9DD;
    --grey:#B2A594;
    --metro:#7EC2EE;
    --metro-soft:#1A3547;
    --reserved:#8FCB8A;
    --reserved-soft:#213821;
    --line:#3A2E27;
    /* burgundy stays the brand color for buttons/backgrounds; wherever it was
       used as *text* on what is now a dark surface, use warm gold instead —
       keeps the accent legible without turning headings/labels reddish-pink */
    --burgundy-text:#D9A854;
    --burgundy-text-deep:#C0883E;
  }
  :root[data-theme="dark"] .notebox, :root[data-theme="dark"] .modal-wiki, :root[data-theme="dark"] .info-row,
  :root[data-theme="dark"] .stop .desc, :root[data-theme="dark"] .modal-desc p, :root[data-theme="dark"] .fb-desc p,
  :root[data-theme="dark"] .settings-row{ color:var(--ink); }
  :root[data-theme="dark"] .info-block h3{ color:var(--burgundy-text-deep); }
  :root[data-theme="dark"] .freeblock{ background:repeating-linear-gradient(135deg, #221A14 0 10px, #1D1712 10px 20px); }
  :root[data-theme="dark"] .fb-sub-row{ border-bottom-color:#4A3B27; }
  :root[data-theme="dark"] .fb-info-btn{ background:var(--card); color:var(--gold); }
  :root[data-theme="dark"] .settings-btn{ background:var(--card); border-color:var(--burgundy-text); color:var(--burgundy-text); }
  :root[data-theme="dark"] .tabbar{ background:rgba(24,18,16,.90); }
</style>
</head>
<body>
<div id="app">
  <header>
    <img class="logo" src="icon.svg" alt="" width="38" height="38">
    <div class="headtext">
      <div class="eyebrow">PLANNING DE VIAJE</div>
      <h1>Bruselas &amp; Ámsterdam</h1>
      <div class="sub">18–22 de agosto de 2026</div>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema"></button>
  </header>
  <main id="main"></main>
  <button class="fab-today" id="fabToday">📍 Ir a hoy</button>
  <div class="tabbar" id="tabbar"></div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-sheet" id="modalSheet">
      <div class="modal-handle"></div>
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-photo" id="modalPhoto"></div>
      <div class="modal-scroll" id="modalScroll"></div>
    </div>
  </div>
</div>

<script>

const P = {
  hotel:[50.833145,4.356487], bru:[50.900240,4.485944], crl:[50.460000,4.452800],
  midi:[50.836440,4.337009], grandplace:[50.846789,4.352436], sablon:[50.840433,4.356253],
  carrefoureuropa:[50.845463,4.356194], saint_hubert:[50.848083,4.355251],

  parc_leopold:[50.838900,4.378300], berlaymont:[50.843800,4.381600], parlamento:[50.838600,4.376100],
  muro_berlin:[50.839600,4.379800],
  brugge_station:[51.197666,3.217851], brugge_markt:[51.208147,3.224801], brugge_burg:[51.208506,3.226838],
  brugge_onzelievevrouw:[51.204690,3.224447], brugge_begijnhof:[51.201345,3.222709], brugge_minnewater:[51.199729,3.223942],
  brugge_rozenhoedkaai:[51.206500,3.227300], brugge_vismarkt:[51.208700,3.227600],
  gent_station:[51.036113,3.710839], gent_gravensteen:[51.057177,3.720723], gent_graslei:[51.054768,3.720750],
  gent_stbavo:[51.053234,3.726506], gent_michielsbrug:[51.053700,3.720300], gent_groentenmarkt:[51.055400,3.720200],
  gent_vrijdagmarkt:[51.056300,3.724000],
  amsterdam:[52.373169,4.892839],
  ams_dam:[52.373169,4.892839], ams_wallen:[52.374362,4.899431], ams_nieuwmarkt:[52.372442,4.900253],
  ams_negenstraatjes:[52.370800,4.885900],
  dinant_ciudadela:[50.260300,4.910600], dinant_mosa:[50.259700,4.911800], dinant_sax:[50.260600,4.911200],
  lux_corniche:[49.610700,6.135200], lux_bock:[49.611300,6.135900], lux_grund:[49.608800,6.132900],
  lux_placedarmes:[49.610900,6.129400],
};
function pt(p){ return `https://www.google.com/maps/search/?api=1&query=${p[0]},${p[1]}`; }
function dir(points, mode){
  const o = points[0], d = points[points.length-1], mid = points.slice(1,-1);
  let u = `https://www.google.com/maps/dir/?api=1&origin=${o[0]},${o[1]}&destination=${d[0]},${d[1]}&travelmode=${mode||"walking"}`;
  if(mid.length) u += "&waypoints=" + mid.map(m=>`${m[0]},${m[1]}`).join("|");
  return u;
}

const mainEl = document.getElementById("main");
const tabbarEl = document.getElementById("tabbar");

// ---------- Persisted settings (localStorage) ----------
const LS_KEY = "bru26_settings_v1";
function loadSettings(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ return {}; }
}
function saveSettings(s){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(s)); }catch(e){}
}
let SETTINGS = Object.assign({ showPastDays:false, done:{}, theme:"system" }, loadSettings());
function setSetting(k,v){ SETTINGS[k]=v; saveSettings(SETTINGS); }

// ---------- Theme (auto / claro / oscuro) ----------
const THEME_ORDER = ["system", "light", "dark"];
const THEME_ICON = { system:"🌗", light:"☀️", dark:"🌙" };
const THEME_LABEL = { system:"Tema: automático (según el sistema)", light:"Tema: claro", dark:"Tema: oscuro" };
const elThemeToggle = document.getElementById("themeToggle");
function effectiveTheme(){
  if(SETTINGS.theme === "light" || SETTINGS.theme === "dark") return SETTINGS.theme;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyTheme(){
  document.documentElement.setAttribute("data-theme", effectiveTheme());
  elThemeToggle.textContent = THEME_ICON[SETTINGS.theme];
  elThemeToggle.title = THEME_LABEL[SETTINGS.theme];
}
elThemeToggle.addEventListener("click", ()=>{
  const next = THEME_ORDER[(THEME_ORDER.indexOf(SETTINGS.theme) + 1) % THEME_ORDER.length];
  setSetting("theme", next);
  applyTheme();
});
// Live-update when the OS theme changes, but only while following it.
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>{
  if(SETTINGS.theme === "system") applyTheme();
});
applyTheme();

// ---------- Today detection ----------
function todayISO(){
  const d = new Date();
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return `${d.getFullYear()}-${mm}-${dd}`;
}
const TODAY = todayISO();
function dayHasPassed(day){ return day.iso && day.iso < TODAY; }
function isToday(day){ return day.iso === TODAY; }

// Pick initial active tab: today's trip day if we're mid-trip, otherwise Day 1.
let active = (DAYS.find(d=>d.iso===TODAY) || DAYS.find(d=>d.key==="d1")).key;

function svgPin(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-7.5 7-12a7 7 0 1 0-14 0c0 4.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.3"/></svg>';
}

// ---------- Emoji flavor ----------
const EMOJI_RULES = [
  [/aeropuerto/i, "✈️"], [/tren /i, "🚆"], [/metro|tranvía/i, "🚇"], [/autobús|flibco/i, "🚌"],
  [/\btaxi\b|\buber\b/i, "🚕"], [/check-in|maletas|consigna/i, "🧳"], [/hotel/i, "🏨"],
  [/comida|cena|desayuno/i, "🍽️"], [/chocolat/i, "🍫"], [/cerveza|leffe|delirium/i, "🍺"],
  [/basílica|iglesia|catedral|capilla|corazón/i, "⛪"], [/castillo|gravensteen|ducal|palacio/i, "🏰"],
  [/parque|jardín|leopold/i, "🌳"], [/puente/i, "🌉"], [/mercad|galer[ií]a/i, "🛍️"], [/museo/i, "🏛️"],
  [/barco|canal/i, "🛥️"], [/mirador|vista|corniche/i, "📸"], [/parlamento/i, "🇪🇺"],
  [/atomium/i, "⚛️"], [/free tour|tour a pie/i, "🚶"], [/plaza|place|markt|dam\b/i, "⛲"],
  [/caminar/i, "🚶"], [/pis\b/i, "🚰"],
];
function emojiFor(s){
  if(s.emoji) return s.emoji;
  for(const [re, em] of EMOJI_RULES){ if(re.test(s.ti)) return em; }
  return "📍";
}
function sectionEmoji(name){
  if(/^Mañana/.test(name)) return "☀️ ";
  if(/^Mediodía/.test(name)) return "🕛 ";
  if(/^Tarde/.test(name)) return "🌇 ";
  if(/^Atardecer/.test(name)) return "🌆 ";
  if(/^Noche/.test(name)) return "🌙 ";
  return "";
}

// ---------- Info modal (place photo + description) ----------
let STOP_REGISTRY = [];
const WIKI_LS_KEY = "bru26_wikicache_v1";
let wikiCache = {};
try{ wikiCache = JSON.parse(localStorage.getItem(WIKI_LS_KEY)) || {}; }catch(e){ wikiCache = {}; }
function persistWikiCache(){
  try{
    const keys = Object.keys(wikiCache);
    if(keys.length > 120){ delete wikiCache[keys[0]]; } // simple cap
    localStorage.setItem(WIKI_LS_KEY, JSON.stringify(wikiCache));
  }catch(e){ /* storage full or unavailable — ignore, in-memory cache still works this session */ }
}
const LOGISTICS_RE = /^(Caminar|Metro|Tren |Autobús|Check-in|Comida r[aá]pida|Desayuno|Aterrizaje|Recoger maletas|Vuelta al hotel|Salida del hotel|Salida en autob|Regreso en autob|Traslado al hotel|Autobús hacia)/i;
function isLogistics(s){ return LOGISTICS_RE.test(s.ti) && !s.wiki; }

let lastFetchHadNetworkError = false;
async function fetchWiki(pair){
  if(!pair) return null;
  const key = pair.join("|");
  if(wikiCache[key] !== undefined) return wikiCache[key];
  const tries = [];
  if(pair[0]) tries.push(["es", pair[0]]);
  if(pair[1]) tries.push(["en", pair[1]]);
  lastFetchHadNetworkError = false;
  for(const [lang, title] of tries){
    try{
      const r = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`, {cache:"force-cache"});
      if(r.ok){
        const j = await r.json();
        if(j && j.extract && j.type !== "disambiguation"){
          wikiCache[key] = j;
          persistWikiCache();
          return j;
        }
      }
    }catch(e){ lastFetchHadNetworkError = true; /* offline, blocked by file:// sandbox, or no CORS */ }
  }
  // Deliberately NOT cached: a null result might just be a transient network
  // problem (e.g. previewing outside real Safari), so every open/retry gets
  // a fresh attempt instead of getting stuck on a cached failure.
  return null;
}

// ---------- "Ir a hoy" quick-jump ----------
const elFabToday = document.getElementById("fabToday");
elFabToday.addEventListener("click", ()=>{
  const todayDay = DAYS.find(d=>d.iso===TODAY);
  if(todayDay){ active = todayDay.key; render(); }
});
function updateFabToday(){
  const todayDay = DAYS.find(d=>d.iso===TODAY);
  elFabToday.style.display = (todayDay && active !== todayDay.key) ? "flex" : "none";
}

const elModalBackdrop = document.getElementById("modalBackdrop");
const elModalPhoto = document.getElementById("modalPhoto");
const elModalScroll = document.getElementById("modalScroll");
document.getElementById("modalClose").addEventListener("click", closeInfo);
elModalBackdrop.addEventListener("click", (e)=>{
  if(e.target === elModalBackdrop) closeInfo();
  const retry = e.target.closest(".retry-link");
  if(retry) openInfo(Number(retry.dataset.retryIdx));
});

function closeInfo(){ elModalBackdrop.classList.remove("open"); }

async function openInfo(idx){
  const s = STOP_REGISTRY[idx];
  if(!s) return;
  elModalBackdrop.classList.add("open");
  elModalPhoto.innerHTML = s.wiki
    ? `<div class="ph-spinner"><span></span></div>`
    : `<div class="ph-fallback"><span class="letter">${(s.ti||"?").charAt(0)}</span></div>`;
  const descHtml = (s.d && s.d.length) ? `<div class="modal-desc">${s.d.map(l=>`<p>${l}</p>`).join("")}</div>` : "";
  const mapHtml = s.url ? `<a class="maplink" href="${s.url}" target="_blank" rel="noopener">${svgPin()} Ver en Google Maps</a>` : "";
  elModalScroll.innerHTML = `<h3>${s.ti}</h3><div id="modalWikiSlot"></div>${descHtml}${mapHtml}`;
  elModalScroll.scrollTop = 0;

  if(s.wiki){
    const data = await fetchWiki(s.wiki);
    // Only apply if this stop is still the one open (avoid race if user taps another fast)
    if(!elModalBackdrop.classList.contains("open")) return;
    if(data){
      const img = data.thumbnail && data.thumbnail.source;
      elModalPhoto.innerHTML = img
        ? `<img src="${img.replace(/\/\d+px-/, "/500px-")}" alt="">`
        : `<div class="ph-fallback"><span class="letter">${(s.ti||"?").charAt(0)}</span></div>`;
      const slot = document.getElementById("modalWikiSlot");
      if(slot) slot.innerHTML = `<div class="modal-wiki">${data.extract}<span class="src">Fuente: Wikipedia</span></div>`;
    } else {
      const msg = lastFetchHadNetworkError
        ? "No se pudo conectar a internet para cargar la foto."
        : "No hay foto disponible para este sitio.";
      elModalPhoto.innerHTML = `<div class="ph-fallback">
        <span class="letter">${(s.ti||"?").charAt(0)}</span>
        <span class="retry-msg">${msg}${lastFetchHadNetworkError ? ' <u class="retry-link" data-retry-idx="'+idx+'">Reintentar</u>' : ''}</span>
      </div>`;
    }
  }
}

function renderTabbar(){
  const visibleDays = DAYS.filter(d=> d.isInfo || SETTINGS.showPastDays || !dayHasPassed(d));
  tabbarEl.innerHTML = visibleDays.map(d=>{
    const label = d.isInfo ? "Info" : d.short;
    const dot = d.isInfo ? "i" : d.key.replace("d","");
    const todayCls = (!d.isInfo && isToday(d)) ? "today" : "";
    return `<button data-key="${d.key}" class="${d.key===active?'active':''} ${todayCls}">
      <span class="dot">${dot}</span><span class="lbl">${label}</span>
    </button>`;
  }).join("");
  tabbarEl.querySelectorAll("button").forEach(b=>{
    b.addEventListener("click", ()=>{ active=b.dataset.key; render(); });
  });
}

function stopCard(s, uid){
  const idx = STOP_REGISTRY.length;
  STOP_REGISTRY.push(s);
  const isDone = uid && SETTINGS.done[uid];
  const hasInfo = !isLogistics(s);
  const kindClass = s.kind==="metro" ? "metro" : s.kind==="reserved" ? "reserved" : "plain";
  const chip = s.kind==="metro" ? '<span class="chip">🚇 Metro/Tranvía</span>' : s.kind==="reserved" ? '<span class="chip">🎫 Reservado</span>' : "";
  const desc = (s.d && s.d.length) ? `<div class="desc">${s.d.map(l=>`<p>${l}</p>`).join("")}</div>` : "";
  const link = s.url ? `<a class="maplink" href="${s.url}" target="_blank" rel="noopener">${svgPin()} Ver en Maps</a>` : "";
  const emoji = emojiFor(s);
  const infoAction = hasInfo ? `<div class="swipe-action action-info"><span class="ic">ⓘ</span><span>Info</span></div>` : "";
  const doneAction = uid ? `<div class="swipe-action action-done"><span class="ic">${isDone?"↺":"✓"}</span><span>${isDone?"Desmarcar":"Hecho"}</span></div>` : "";
  return `<div class="stop ${kindClass} ${isDone?'done':''}" data-idx="${hasInfo?idx:''}" data-uid="${uid||''}">
    ${infoAction}${doneAction}
    <div class="stop-content">
      <div class="row1"><span class="emoji">${emoji}</span><span class="time">${s.t||""}</span><span class="title">${s.ti}</span>${chip}</div>
      ${desc}${link}
    </div>
  </div>`;
}

function freeBlock(fb){
  // fb: {t, ti, d:[...], subs:[{ti,d,url,wiki}]}
  let html = `<div class="freeblock">
    <div class="fb-ribbon">🕒 TIEMPO LIBRE${fb.t ? " · " + fb.t : ""}</div>
    <div class="fb-title">${fb.ti}</div>`;
  if(fb.d && fb.d.length) html += `<div class="fb-desc">${fb.d.map(l=>`<p>${l}</p>`).join("")}</div>`;
  if(fb.subs && fb.subs.length){
    html += `<div class="fb-subs">`;
    fb.subs.forEach(sub=>{
      const idx = STOP_REGISTRY.length;
      STOP_REGISTRY.push(sub);
      const emoji = emojiFor(sub);
      const infoBtn = `<button class="fb-info-btn" data-idx="${idx}">i</button>`;
      const link = sub.url ? `<a class="maplink sub" href="${sub.url}" target="_blank" rel="noopener">${svgPin()}</a>` : "";
      html += `<div class="fb-sub-row">
        <span class="emoji">${emoji}</span><span class="fb-sub-title">${sub.ti}</span>${infoBtn}${link}
      </div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

// ---------- Per-day progress ("X/Y paradas hechas") ----------
function computeDayProgress(day){
  let total = 0, done = 0, counter = 0;
  day.sections.forEach(sec=>{
    sec.stops.forEach(s=>{
      counter++;
      if(s.free) return; // free-time blocks aren't tracked as done/undone
      total++;
      if(SETTINGS.done[day.key + "-" + counter]) done++;
    });
  });
  return {done, total};
}
function dayProgressHtml(day){
  const {done, total} = computeDayProgress(day);
  if(!total) return "";
  const pct = Math.round((done/total)*100);
  return `<div class="day-progress" id="dayProgress">
    <span class="dp-label">${done}/${total} hechas</span>
    <span class="bar"><span style="width:${pct}%"></span></span>
  </div>`;
}
function updateDayProgressUI(){
  const day = DAYS.find(d=>d.key===active);
  if(!day || day.isInfo) return;
  const {done, total} = computeDayProgress(day);
  if(!total) return;
  const label = document.querySelector("#dayProgress .dp-label");
  const bar = document.querySelector("#dayProgress .bar > span");
  if(label) label.textContent = `${done}/${total} hechas`;
  if(bar) bar.style.width = Math.round((done/total)*100) + "%";
}

function renderDay(day){
  let html = `<div class="day-banner">
    <div class="tag">${day.date}</div>
    <h2>${day.title}</h2>
    <p>${day.subtitle}</p>
    ${dayProgressHtml(day)}
  </div>`;
  html += `<div class="swipe-hint"><span class="arrows">⇠⇢</span> Desliza una parada: izquierda para marcarla hecha ✓, derecha para ver su información ⓘ</div>`;
  if(day.topNote) html += `<div class="notebox"><p>${day.topNote}</p></div>`;
  let counter = 0;
  day.sections.forEach(sec=>{
    html += `<div class="section-label">${sectionEmoji(sec.name)}${sec.name}</div>`;
    sec.stops.forEach(s=>{
      counter++;
      if(s.free){ html += freeBlock(s); }
      else{ html += stopCard(s, day.key + "-" + counter); }
    });
  });
  if(day.note) html += `<div class="notebox"><p>${day.note}</p></div>`;
  return html;
}

function renderInfo(){
  let html = `<div class="day-banner">
    <div class="tag">Información general</div>
    <h2>Antes de salir</h2>
    <p>Vuelos, alojamiento, reservas y consejos rápidos</p>
  </div>`;
  html += `<div class="info-block"><h3>Vuelos</h3>` +
    INFO.flights.map(f=>`<div class="info-row"><b>${f[0]}:</b> ${f[1]}</div>`).join("") + `</div>`;
  html += `<div class="info-block"><h3>Alojamiento</h3>` +
    INFO.hotel.map(l=>`<div class="info-row">${l}</div>`).join("") + `</div>`;
  html += `<div class="info-block"><h3>Reservas</h3>` +
    INFO.reservas.map(r=>`<div class="info-row"><b>${r[0]}:</b> ${r[1]}</div>`).join("") + `</div>`;
  html += `<div class="notebox">${INFO.tips.map(t=>{
    const link = t.url ? ` <a class="tip-link" href="${t.url}" target="_blank" rel="noopener">${t.label||"Abrir"} →</a>` : "";
    return `<p>${t.text}${link}</p>`;
  }).join("")}</div>`;
  html += `<div class="info-block"><h3>Ajustes</h3>
    <label class="settings-row">
      <span>Mostrar todos los días (incluidos los que ya pasaron)</span>
      <input type="checkbox" id="chkShowPast" ${SETTINGS.showPastDays?"checked":""}>
    </label>
    <button class="settings-btn" id="btnResetDone">Reiniciar paradas marcadas como visitadas</button>
    <p class="settings-note">Si abres la app mediante el Atajo de iOS (data:text/html), las paradas marcadas como hechas y las fotos guardadas se reinician cada vez que la vuelves a abrir — es normal, no es un fallo.</p>
  </div>`;
  return html;
}

function render(){
  const day = DAYS.find(d=>d.key===active);
  STOP_REGISTRY = [];
  mainEl.innerHTML = day.isInfo ? renderInfo() : renderDay(day);
  mainEl.scrollTop = 0;
  renderTabbar();
  updateFabToday();
  if(day.isInfo){
    const chk = document.getElementById("chkShowPast");
    if(chk) chk.addEventListener("change", ()=>{ setSetting("showPastDays", chk.checked); renderTabbar(); });
    wireResetButton();
  }
}

let resetArmed = false;
let resetTimer = null;
function wireResetButton(){
  const btn = document.getElementById("btnResetDone");
  if(!btn) return;
  resetArmed = false;
  btn.addEventListener("click", ()=>{
    if(!resetArmed){
      resetArmed = true;
      btn.textContent = "¿Seguro? Toca otra vez para confirmar";
      btn.classList.add("danger");
      clearTimeout(resetTimer);
      resetTimer = setTimeout(()=>{
        resetArmed = false;
        btn.textContent = "Reiniciar paradas marcadas como visitadas";
        btn.classList.remove("danger");
      }, 3500);
    } else {
      clearTimeout(resetTimer);
      resetArmed = false;
      setSetting("done", {});
      render();
    }
  });
}

// ---------- Tap on emoji = quick info (secondary affordance) ----------
mainEl.addEventListener("click", (e)=>{
  const fbBtn = e.target.closest(".fb-info-btn");
  if(fbBtn){ openInfo(Number(fbBtn.dataset.idx)); return; }
  const emojiTap = e.target.closest(".stop .emoji");
  if(emojiTap){
    const card = emojiTap.closest(".stop");
    if(card && card.dataset.idx !== "") openInfo(Number(card.dataset.idx));
  }
});

// ---------- Swipe left = toggle done · swipe right = open info ----------
function toggleDoneOnCard(card){
  const uid = card.dataset.uid;
  if(!uid) return;
  const nowDone = !SETTINGS.done[uid];
  SETTINGS.done[uid] = nowDone;
  saveSettings(SETTINGS);
  card.classList.toggle("done", nowDone);
  const doneAction = card.querySelector(".action-done");
  if(doneAction) doneAction.innerHTML = `<span class="ic">${nowDone?"↺":"✓"}</span><span>${nowDone?"Desmarcar":"Hecho"}</span>`;
  updateDayProgressUI();
}

let sw = null; // active swipe state
mainEl.addEventListener("touchstart", (e)=>{
  const card = e.target.closest(".stop");
  if(!card) return;
  const t = e.touches[0];
  sw = { card, startX:t.clientX, startY:t.clientY, dx:0, locked:null };
  card.classList.add("dragging");
}, {passive:true});

mainEl.addEventListener("touchmove", (e)=>{
  if(!sw) return;
  const t = e.touches[0];
  const dx = t.clientX - sw.startX;
  const dy = t.clientY - sw.startY;
  if(sw.locked === null){
    if(Math.abs(dx) > 8 || Math.abs(dy) > 8) sw.locked = Math.abs(dx) > Math.abs(dy) ? "h" : "v";
  }
  if(sw.locked === "h"){
    e.preventDefault();
    const hasInfo = sw.card.dataset.idx !== "";
    const hasDone = !!sw.card.dataset.uid;
    let clamped = dx;
    if(clamped > 0 && !hasInfo) clamped = 0;
    if(clamped < 0 && !hasDone) clamped = 0;
    clamped = Math.max(-92, Math.min(92, clamped));
    sw.dx = clamped;
    const content = sw.card.querySelector(".stop-content");
    if(content) content.style.transform = `translateX(${clamped}px)`;
    const infoAction = sw.card.querySelector(".action-info");
    const doneAction = sw.card.querySelector(".action-done");
    if(infoAction) infoAction.style.opacity = String(Math.max(0, clamped) / 80);
    if(doneAction) doneAction.style.opacity = String(Math.max(0, -clamped) / 80);
  }
}, {passive:false});

mainEl.addEventListener("touchend", ()=>{
  if(!sw) return;
  const card = sw.card;
  const dx = sw.dx;
  const THRESH = 58;
  card.classList.remove("dragging");
  if(sw.locked === "h" && Math.abs(dx) > THRESH){
    if(dx < 0) toggleDoneOnCard(card);
    else{
      const idx = card.dataset.idx;
      if(idx !== "") openInfo(Number(idx));
    }
  }
  const content = card.querySelector(".stop-content");
  if(content) content.style.transform = "translateX(0)";
  const infoAction = card.querySelector(".action-info");
  const doneAction = card.querySelector(".action-done");
  if(infoAction) infoAction.style.opacity = 0;
  if(doneAction) doneAction.style.opacity = 0;
  sw = null;
}, {passive:true});

render();

// ---------- Offline support ----------
// Registration silently no-ops on file:// / data: contexts (no secure origin)
// and on the iOS "Add to Home Screen via Shortcut" data:text/html trick —
// same graceful-degradation the wiki cache already relies on.
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
